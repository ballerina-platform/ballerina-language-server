apply from: "$rootDir/gradle/javaProject.gradle"
apply plugin: "com.github.johnrengelman.shadow"
apply plugin: "java"

description = 'Ballerina - Scanner LS Extension'

configurations.all {
    resolutionStrategy.preferProjectModules()
}

configurations {
    dist {
        transitive true
    }
}

dependencies {
    implementation project(":langserver-core")
    implementation project(":langserver-commons")

    implementation "org.ballerinalang:ballerina-lang:${ballerinaLangVersion}"
    implementation "org.ballerinalang:ballerina-parser:${ballerinaLangVersion}"
    implementation "org.ballerinalang:ballerina-tools-api:${ballerinaLangVersion}"
    implementation "org.ballerinalang:language-server-commons:${ballerinaLangVersion}"
    implementation "org.ballerinalang:language-server-core:${ballerinaLangVersion}"
    implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:${eclipseLsp4jVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    testImplementation "org.testng:testng:${testngVersion}"
    testImplementation "org.ballerinalang:ballerina-lang:${ballerinaLangVersion}"
    testImplementation "org.ballerinalang:ballerina-parser:${ballerinaLangVersion}"
    testImplementation "org.ballerinalang:ballerina-tools-api:${ballerinaLangVersion}"
    testImplementation "org.eclipse.lsp4j:org.eclipse.lsp4j:${eclipseLsp4jVersion}"
    testRuntimeOnly "org.slf4j:slf4j-jdk14:${slf4jJdk14Version}"
}

tasks.withType(Checkstyle).configureEach {
    minHeapSize = '64m'
    maxHeapSize = '256m'
}

tasks.named('checkstyleTest') {
    mustRunAfter(tasks.named('checkstyleMain'))
}

tasks.named('test') {
    mustRunAfter(tasks.named('checkstyleMain'))
    mustRunAfter(tasks.named('checkstyleTest'))
}

ext.moduleName = 'io.ballerina.scanner.extension'
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.dist
    from { configurations.dist.collect { it.isDirectory() ? it : zipTree(it) } } {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
}

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}

artifacts {
    archives shadowJar
}
